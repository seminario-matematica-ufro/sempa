<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agregar una charla</title>
<style>
  :root { --tinta: #1c2430; --gris: #5a6472; --linea: #d9dde3; --azul: #215C84; --turquesa: #38A0B2; --verde: #9ED68F; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 1.05rem; line-height: 1.55; color: var(--tinta); }
  body::before { content: ""; display: block; height: 5px; background: linear-gradient(90deg, var(--azul) 0 34%, var(--turquesa) 34% 67%, var(--verde) 67% 100%); }
  main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-size: 1.7rem; margin: 0 0 .5rem; }
  p.ayuda, small { color: var(--gris); }
  label { display: block; font-weight: 600; margin: 1.1rem 0 .25rem; }
  input, textarea { width: 100%; font: inherit; padding: .5rem .6rem; border: 1px solid var(--linea); border-radius: .35rem; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
  textarea { min-height: 9rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .95rem; }
  .fila { display: grid; gap: 0 1rem; grid-template-columns: 1fr 1fr; }
  button { font: inherit; font-weight: 600; background: var(--azul); color: #fff; border: 0; border-radius: .35rem; padding: .6rem 1.1rem; cursor: pointer; margin-top: 1.4rem; }
  #salida { min-height: 12rem; background: #f5f6f8; }
  #aviso { color: #1d6b2f; font-weight: 600; margin-left: .75rem; }
  .error { color: #a02020; font-weight: 600; }
  @media (max-width: 36rem) { .fila { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Agregar una charla</h1>
  <p class="ayuda">Completa los datos, pulsa «Generar» y copia el resultado. Luego pégalo dentro de la lista <code>CHARLAS</code> del archivo <code>charlas.js</code> en GitHub, justo antes del <code>];</code> final. Los campos con * son obligatorios.</p>

  <div class="fila">
    <div><label for="fecha">Fecha *</label><input id="fecha" type="date"></div>
    <div><label for="hora">Hora</label><input id="hora" type="time"></div>
  </div>
  <label for="lugar">Lugar</label>
  <input id="lugar" placeholder="Auditorio Pablo Neruda, Facultad de ... (UFRO)">
  <label for="titulo">Título *</label>
  <input id="titulo">
  <div class="fila">
    <div><label for="expositor">Expositor *</label><input id="expositor"></div>
    <div><label for="procedencia">Procedencia</label><input id="procedencia" placeholder="Estudiante de Magíster, Universidad de ..."></div>
  </div>
  <label for="colaboradores">Trabajo en conjunto con (opcional)</label>
  <input id="colaboradores" placeholder="Nombre, institución">
  <label for="resumen">Resumen (opcional)</label>
  <textarea id="resumen" placeholder="Pega el resumen aquí. Fórmulas entre $...$. Deja una línea en blanco entre párrafos."></textarea>
  <label for="referencias">Referencias (opcional)</label>
  <textarea id="referencias" placeholder="Una referencia por línea. Para cursiva usa <em>título</em>."></textarea>
  <div class="fila">
    <div><label for="diapositivas">Diapositivas (opcional)</label><input id="diapositivas" placeholder="diapositivas/2026-10-09-apellido.pdf"></div>
    <div><label for="video">Video (opcional)</label><input id="video" placeholder="https://..."></div>
  </div>

  <button type="button" id="generar">Generar</button>
  <p id="error" class="error" role="alert"></p>

  <label for="salida">Resultado para pegar en charlas.js</label>
  <textarea id="salida" readonly></textarea>
  <button type="button" id="copiar">Copiar</button><span id="aviso" role="status"></span>
</main>

<script>
(function () {
  function v(id) { return document.getElementById(id).value.trim(); }
  function q(s) { return JSON.stringify(s); }
  function raw(s) { return /`|\$\{|\\$/.test(s) ? JSON.stringify(s) : "String.raw`" + s + "`"; }

  document.getElementById("generar").addEventListener("click", function () {
    var err = document.getElementById("error");
    if (!v("fecha") || !v("titulo") || !v("expositor")) {
      err.textContent = "Faltan campos obligatorios: fecha, título y expositor.";
      return;
    }
    err.textContent = "";
    var L = ["  {", "    fecha: " + q(v("fecha")) + ","];
    if (v("hora")) L.push("    hora: " + q(v("hora")) + ",");
    if (v("lugar")) L.push("    lugar: " + q(v("lugar")) + ",");
    L.push("    titulo: " + q(v("titulo")) + ",");
    L.push("    expositor: " + q(v("expositor")) + ",");
    if (v("procedencia")) L.push("    procedencia: " + q(v("procedencia")) + ",");
    if (v("colaboradores")) L.push("    colaboradores: " + q(v("colaboradores")) + ",");
    if (v("resumen")) L.push("    resumen: " + raw(v("resumen").replace(/\r\n/g, "\n")) + ",");
    var refs = v("referencias").split(/\n+/).map(function (r) { return r.trim(); }).filter(Boolean);
    if (refs.length) {
      L.push("    referencias: [");
      refs.forEach(function (r) { L.push("      " + raw(r) + ","); });
      L.push("    ],");
    }
    if (v("diapositivas")) L.push("    diapositivas: " + q(v("diapositivas")) + ",");
    if (v("video")) L.push("    video: " + q(v("video")) + ",");
    L.push("  },");
    document.getElementById("salida").value = L.join("\n");
  });

  document.getElementById("copiar").addEventListener("click", function () {
    var t = document.getElementById("salida"), aviso = document.getElementById("aviso");
    if (!t.value) { aviso.textContent = "Primero pulsa «Generar»."; return; }
    function listo() { aviso.textContent = "Copiado."; setTimeout(function () { aviso.textContent = ""; }, 2500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t.value).then(listo, function () { t.select(); document.execCommand("copy"); listo(); });
    } else { t.select(); document.execCommand("copy"); listo(); }
  });
})();
</script>
</body>
</html>
